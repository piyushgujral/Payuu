<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payuu Live | Browser Stream Overlay</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Poppins:wght@500;700;800&display=swap" rel="stylesheet">

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg-navy: #07192F;
            --bg-royal: #0B2B4A;
            --gold-primary: #FFD700;
            --gold-glow: rgba(255, 215, 0, 0.6);
            --gold-grad: linear-gradient(135deg, #FFE866 0%, #FFA800 100%);
            --pink-neon: #FF007F;
            --cyan-neon: #00F0FF;
            --white: #FFFFFF;
            --text-sub: #A0B3C6;
            --font-display: 'Orbitron', sans-serif;
            --font-body: 'Poppins', sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; background: transparent !important; overflow: hidden; font-family: var(--font-body); display: flex; align-items: center; justify-content: center; }
        #overlay-stage { position: relative; width: 100%; max-width: 580px; padding: 20px; display: flex; align-items: center; justify-content: center; }
        .alert-card { background: rgba(7,25,47,.92); border: 2px solid var(--gold-primary); border-radius: 24px; padding: 28px; width: 100%; text-align: center; box-shadow: 0 0 35px var(--gold-glow), inset 0 0 15px rgba(255,215,0,.2); backdrop-filter: blur(16px); position: relative; overflow: hidden; opacity: 0; transform: translateY(100px) scale(.8); pointer-events: none; transition: all .6s cubic-bezier(.34,1.56,.64,1); }
        .alert-card.active { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
        .alert-card::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: linear-gradient(45deg,transparent,rgba(255,215,0,.15),transparent); transform: rotate(45deg); animation: sweepGlow 3s infinite linear; pointer-events: none; }
        @keyframes sweepGlow { 0% { transform: translateX(-100%) rotate(45deg); } 100% { transform: translateX(100%) rotate(45deg); } }
        .logo-aura-wrapper { position: relative; width: 110px; height: 110px; margin: 0 auto 16px; display: flex; align-items: center; justify-content: center; }
        .gold-ring-spin { position: absolute; width: 100%; height: 100%; border-radius: 50%; border: 3px dashed var(--gold-primary); box-shadow: 0 0 20px var(--gold-glow); animation: spinRing 10s linear infinite; }
        @keyframes spinRing { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .alert-logo-img { width: 82%; height: 82%; border-radius: 50%; object-fit: cover; border: 3px solid var(--gold-primary); box-shadow: 0 0 25px var(--gold-glow); z-index: 2; }
        .supporter-header { font-family: var(--font-display); font-size: 1.8rem; font-weight: 900; color: var(--white); letter-spacing: 1.5px; margin-bottom: 6px; text-shadow: 0 0 12px rgba(255,255,255,.4); position: relative; z-index: 3; }
        .amount-banner-pill { display: inline-block; background: var(--gold-grad); color: #030B17; font-family: var(--font-display); font-size: 1.6rem; font-weight: 900; padding: 6px 24px; border-radius: 30px; box-shadow: 0 0 25px var(--gold-glow); margin-bottom: 14px; letter-spacing: 1px; position: relative; z-index: 3; }
        .message-speech-box { background: rgba(255,255,255,.05); border: 1px solid rgba(255,215,0,.3); border-radius: 16px; padding: 12px 18px; color: var(--white); font-size: 1rem; font-weight: 500; margin-bottom: 14px; word-break: break-word; line-height: 1.4; position: relative; z-index: 3; }
        .thankyou-footer { font-size: .82rem; color: var(--cyan-neon); font-weight: 700; letter-spacing: 1px; text-transform: uppercase; position: relative; z-index: 3; }
        .voice-status { position: absolute; left: -99999px; width: 1px; height: 1px; overflow: hidden; }
        @media (max-width: 600px) { #overlay-stage { padding: 10px; } .alert-card { padding: 20px; border-radius: 18px; } .supporter-header { font-size: 1.4rem; } .amount-banner-pill { font-size: 1.3rem; padding: 4px 18px; } .message-speech-box { font-size: .88rem; } }
    </style>
</head>
<body>
    <div id="overlay-stage">
        <div class="alert-card" id="alert-card">
            <div class="logo-aura-wrapper"><div class="gold-ring-spin"></div><img src="assets/images/logo.png" alt="Payuu Live Logo" class="alert-logo-img" id="alert-logo"></div>
            <div class="supporter-header" id="alert-name">GamerX</div>
            <div class="amount-banner-pill" id="alert-amount">₹500</div>
            <div class="message-speech-box" id="alert-message">"Keep up the awesome streams!"</div>
            <div class="thankyou-footer">❤️ Thank you for supporting Payuu Live! ❤️</div>
        </div>
    </div>
    <div class="voice-status" id="voice-status"></div>

    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-storage-compat.js"></script>
    <script src="firebase.js?v=20260906"></script>
    <script src="js/engagement-overlay.js?v=20260906"></script>

    <script>
        const overlayQueue = [];
        const overlayClientId = "overlay-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 10);
        let isDisplayingAlert = false;
        let currentAlert = null;
        let siteSettings = { websiteName:"Payuu Live", streamerName:"Payuu Live", currencySymbol:"₹", voice:{enabled:true,gender:"female",language:"en-IN",volume:.9,pitch:1,rate:1}, overlay:{duration:8,volume:.9,sound:true,confetti:true} };

        if (window.firebaseDB && typeof window.firebaseDB.listenSettings === "function") {
            window.firebaseDB.listenSettings((settings) => {
                if (!settings) return;
                siteSettings = {...siteSettings,...settings,voice:{...siteSettings.voice,...(settings.voice||{})},overlay:{...siteSettings.overlay,...(settings.overlay||{})}};
                if (settings.logoUrl) { const logoEl=document.getElementById("alert-logo"); if (logoEl) logoEl.src=settings.logoUrl; }
            });
        }

        function playAlertChime() {
            try {
                if (siteSettings.overlay?.sound === false) return;
                const AudioContextClass=window.AudioContext||window.webkitAudioContext;
                if (!AudioContextClass) return;
                const ctx=new AudioContextClass(), volume=Number(siteSettings.overlay?.volume??.8);
                const osc1=ctx.createOscillator(),gain1=ctx.createGain(); osc1.type="sine"; osc1.frequency.setValueAtTime(880,ctx.currentTime); gain1.gain.setValueAtTime(.35*volume,ctx.currentTime); gain1.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.8); osc1.connect(gain1);gain1.connect(ctx.destination);osc1.start();osc1.stop(ctx.currentTime+.8);
                const osc2=ctx.createOscillator(),gain2=ctx.createGain(); osc2.type="sine";osc2.frequency.setValueAtTime(1046.5,ctx.currentTime+.15);gain2.gain.setValueAtTime(.4*volume,ctx.currentTime+.15);gain2.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+1.2);osc2.connect(gain2);gain2.connect(ctx.destination);osc2.start(ctx.currentTime+.15);osc2.stop(ctx.currentTime+1.25);
            } catch(error) { console.warn("Chime error:",error); }
        }
        function triggerConfettiBurst() { try { if(siteSettings.overlay?.confetti===false||typeof confetti!=="function") return; confetti({particleCount:70,spread:80,origin:{y:.5},colors:["#FFD700","#FF007F","#00F0FF","#FFFFFF"]}); } catch(error) { console.warn("Confetti error:",error); } }
        function cleanSpeechText(text) { return String(text||"").replace(/https?:\/\/\S+/gi,"").replace(/www\.\S+/gi,"").replace(/\s+/g," ").trim(); }
        function buildSpeechText(item) { const name=cleanSpeechText(item?.name)||"A Supporter",amount=Number(item?.amount||0),message=cleanSpeechText(item?.msg),lang=String(siteSettings.voice?.language||"en-IN").toLowerCase(); if(lang.startsWith("hi")){let t=`${name} ने ${amount} रुपये का सपोर्ट किया।`;if(message)t+=` संदेश: ${message}`;return t;} let t=`New Support! ${name} supported ${amount} rupees.`;if(message)t+=` Message: ${message}`;return t; }
        function speakTextWithTTS(text,onComplete) { const done=typeof onComplete==="function"?onComplete:()=>{}; try { if(!siteSettings.voice?.enabled||!window.speechSynthesis){done();return;} window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=siteSettings.voice?.language||"en-IN";u.volume=Number(siteSettings.voice?.volume??.9);u.pitch=Number(siteSettings.voice?.pitch??1);u.rate=Number(siteSettings.voice?.rate??1);u.onend=done;u.onerror=done;window.speechSynthesis.speak(u);}catch(_){done();} }
        function showNormalAlert(item,key) { if(!item||item.eventType==="engagement") return; if(window.firebaseDB&&typeof window.firebaseDB.claimOverlayAlert==="function"){window.firebaseDB.claimOverlayAlert(key,overlayClientId).then(claimed=>{if(!claimed)return;playAlertChime();triggerConfettiBurst();showNormalAlertCard(item);});} else { showNormalAlertCard(item); } }
        function showNormalAlertCard(item) { const card=document.getElementById("alert-card"); if(!card)return; document.getElementById("alert-name").textContent=item.name||"A Supporter";document.getElementById("alert-amount").textContent=`₹${Number(item.amount||0).toLocaleString("en-IN")}`;document.getElementById("alert-message").textContent=item.msg||"";card.classList.add("active");isDisplayingAlert=true;currentAlert=item;const duration=Math.max(3,Math.min(30,Number(siteSettings.overlay?.duration||8)));speakTextWithTTS(buildSpeechText(item),()=>{});setTimeout(()=>{card.classList.remove("active");isDisplayingAlert=false;currentAlert=null;},duration*1000); }
        if(window.firebaseDB&&typeof window.firebaseDB.listenOverlay==="function") window.firebaseDB.listenOverlay((data,key)=>showNormalAlert(data,key));
    </script>
</body>
</html>
