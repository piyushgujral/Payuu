<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Payuu Live | Browser Stream Overlay</title><script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script><style>:root{--gold-primary:#FFD700;--gold-glow:rgba(255,215,0,.6);--gold-grad:linear-gradient(135deg,#FFE866 0%,#FFA800 100%);--cyan-neon:#00F0FF;--white:#FFF;--font-display:'Orbitron',sans-serif;--font-body:'Poppins',sans-serif}*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;background:transparent!important;overflow:hidden;font-family:var(--font-body);display:flex;align-items:center;justify-content:center}#overlay-stage{position:relative;width:100%;max-width:580px;padding:20px;display:flex;align-items:center;justify-content:center}.alert-card{background:rgba(7,25,47,.92);border:2px solid var(--gold-primary);border-radius:24px;padding:28px;width:100%;text-align:center;box-shadow:0 0 35px var(--gold-glow),inset 0 0 15px rgba(255,215,0,.2);backdrop-filter:blur(16px);position:relative;overflow:hidden;opacity:0;transform:translateY(100px) scale(.8);pointer-events:none;transition:all .6s cubic-bezier(.34,1.56,.64,1)}.alert-card.active{opacity:1;transform:translateY(0) scale(1);pointer-events:auto}.alert-card:before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:linear-gradient(45deg,transparent,rgba(255,215,0,.15),transparent);transform:rotate(45deg);animation:sweepGlow 3s infinite linear;pointer-events:none}@keyframes sweepGlow{0%{transform:translateX(-100%) rotate(45deg)}100%{transform:translateX(100%) rotate(45deg)}}.logo-aura-wrapper{position:relative;width:110px;height:110px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center}.gold-ring-spin{position:absolute;width:100%;height:100%;border-radius:50%;border:3px dashed var(--gold-primary);box-shadow:0 0 20px var(--gold-glow);animation:spinRing 10s linear infinite}@keyframes spinRing{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}.alert-logo-img{width:82%;height:82%;border-radius:50%;object-fit:cover;border:3px solid var(--gold-primary);box-shadow:0 0 25px var(--gold-glow);z-index:2}.supporter-header{font-family:var(--font-display);font-size:1.8rem;font-weight:900;color:var(--white);letter-spacing:1.5px;margin-bottom:6px;text-shadow:0 0 12px rgba(255,255,255,.4);position:relative;z-index:3}.amount-banner-pill{display:inline-block;background:var(--gold-grad);color:#030B17;font-family:var(--font-display);font-size:1.6rem;font-weight:900;padding:6px 24px;border-radius:30px;box-shadow:0 0 25px var(--gold-glow);margin-bottom:14px;letter-spacing:1px;position:relative;z-index:3}.message-speech-box{background:rgba(255,255,255,.05);border:1px solid rgba(255,215,0,.3);border-radius:16px;padding:12px 18px;color:var(--white);font-size:1rem;font-weight:500;margin-bottom:14px;word-break:break-word;line-height:1.4;position:relative;z-index:3}.thankyou-footer{font-size:.82rem;color:var(--cyan-neon);font-weight:700;letter-spacing:1px;text-transform:uppercase;position:relative;z-index:3}.voice-player{position:fixed;left:50%;bottom:2px;width:2px;height:2px;opacity:.02;pointer-events:none;z-index:999999}</style></head><body><div id="overlay-stage"><div class="alert-card" id="alert-card"><div class="logo-aura-wrapper"><div class="gold-ring-spin"></div><img src="assets/images/logo.png" alt="Payuu Live Logo" class="alert-logo-img" id="alert-logo"></div><div class="supporter-header" id="alert-name">GamerX</div><div class="amount-banner-pill" id="alert-amount">₹500</div><div class="message-speech-box" id="alert-message">"Keep up the awesome streams!"</div><div class="thankyou-footer">❤️ Thank you for supporting Payuu Live! ❤️</div></div></div><audio id="recorded-voice-player" class="voice-player" preload="auto" playsinline></audio>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-storage-compat.js"></script><script src="firebase.js?v=20260918"></script><script src="js/engagement-overlay.js?v=20260918"></script><script>
const overlayOpenedAt=Date.now();let superChatListenerStarted=false;const displayedSuperChats=new Set();let siteSettings={voice:{enabled:true,gender:"female",language:"en-IN",volume:.9,pitch:1,rate:1},overlay:{duration:8,volume:.9,sound:true,confetti:true}};let recordedVoiceAudioContext=null;let recordedVoiceSource=null;
if(window.firebaseDB&&typeof window.firebaseDB.listenSettings==="function")window.firebaseDB.listenSettings(s=>{if(!s)return;siteSettings={...siteSettings,...s,voice:{...siteSettings.voice,...(s.voice||{})},overlay:{...siteSettings.overlay,...(s.overlay||{})}};if(s.logoUrl){const e=document.getElementById("alert-logo");if(e)e.src=s.logoUrl}});
function playAlertChime(){
  try{
    if(siteSettings.overlay?.sound===false)return;
    const c=ensureRecordedVoiceOutput();
    if(!c)return;
    if(c.state==="suspended")c.resume().catch(()=>{});
    const v=Number(siteSettings.overlay?.volume??.8);
    const o=c.createOscillator();
    const g=c.createGain();
    o.frequency.value=880;
    g.gain.setValueAtTime(.35*v,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,c.currentTime+.8);
    o.connect(g);
    g.connect(c.destination);
    o.start();
    o.stop(c.currentTime+.8);
  }catch(_){}
}
function triggerConfettiBurst(){try{if(siteSettings.overlay?.confetti!==false&&typeof confetti==='function')confetti({particleCount:70,spread:80,origin:{y:.5},colors:["#FFD700","#FF007F","#00F0FF","#FFFFFF"]})}catch(_){}}
function cleanSpeechText(t){return String(t||"").replace(/https?:\/\/\S+/gi,"").replace(/www\.\S+/gi,"").replace(/\s+/g," ").trim()}
function buildIntro(item){const name=cleanSpeechText(item?.name)||"A Supporter",amount=Number(item?.amount||0),lang=String(siteSettings.voice?.language||"en-IN").toLowerCase();return lang.startsWith("hi")?`${name} ने ${amount} रुपये का सपोर्ट किया।`:`New Support! ${name} supported ${amount} rupees.`}
function speak(text,onDone){const done=typeof onDone==='function'?onDone:()=>{};try{if(!siteSettings.voice?.enabled||!window.speechSynthesis){done();return}window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(cleanSpeechText(text));u.lang=siteSettings.voice?.language||"en-IN";u.volume=Number(siteSettings.voice?.volume??.9);u.pitch=Number(siteSettings.voice?.pitch??1);u.rate=Number(siteSettings.voice?.rate??1);u.onend=done;u.onerror=done;window.speechSynthesis.speak(u)}catch(_){done()}}
function ensureRecordedVoiceOutput(){
  try{
    const A=window.AudioContext||window.webkitAudioContext;
    if(!A)return null;
    if(!recordedVoiceAudioContext)recordedVoiceAudioContext=new A();
    if(recordedVoiceAudioContext.state==="suspended")recordedVoiceAudioContext.resume().catch(()=>{});
    return recordedVoiceAudioContext;
  }catch(e){
    console.error("Recorded voice AudioContext unavailable:",e);
    return null;
  }
}

async function playRecordedVoice(item,onDone){
  const done=typeof onDone==="function"?onDone:()=>{};
  const key=String(item?.voiceKey||"").trim();
  const legacyUrl=String(item?.voiceUrl||"").trim();

  // New recordings use Cloudflare R2 voice keys. Older recordings may have
  // a Firebase Storage path in voiceKey/voiceUrl. Resolve those legacy
  // references before falling back to the R2 endpoint.
  let url="";
  try{
    if(key && (/^gs:\/\//i.test(key)||/^https?:\/\//i.test(key)||/^superchat-voice\//i.test(key))){
      if(/^https?:\/\//i.test(key)){
        url=key;
      }else if(window.firebase?.storage){
        const ref=firebase.storage().refFromURL(/^gs:\/\//i.test(key)?key:key);
        url=await ref.getDownloadURL();
      }
    }
    if(!url && legacyUrl){
      if(/^https?:\/\//i.test(legacyUrl)){
        url=legacyUrl;
      }else if(window.firebase?.storage){
        try{
          const ref=/^gs:\/\//i.test(legacyUrl)
            ? firebase.storage().refFromURL(legacyUrl)
            : firebase.storage().ref(legacyUrl.replace(/^\/+/, ""));
          url=await ref.getDownloadURL();
        }catch(pathError){
          console.warn("PAYUU VOICE: legacy voice path could not be resolved",{
            legacyUrl,message:pathError?.message
          });
        }
      }
    }
    if(!url && key){
      url="/api/play-voice?key="+encodeURIComponent(key);
    }
  }catch(legacyError){
    console.warn("PAYUU VOICE: legacy Firebase Storage URL resolution failed",{
      key,message:legacyError?.message
    });
    if(legacyUrl)url=legacyUrl;
    else if(key && !/^superchat-voice\//i.test(key))url="/api/play-voice?key="+encodeURIComponent(key);
  }

  if(!url){
    console.error("PAYUU VOICE: no playable voice reference on overlay item",item);
    done();
    return false;
  }

  let finished=false;
  const finish=()=>{
    if(finished)return;
    finished=true;
    done();
  };

  console.log("PAYUU VOICE: attempting recorded playback",{key,url,mime:item?.voiceMimeType,duration:item?.voiceDuration});

  // First use a plain audio element. This is the most reliable path in
  // OBS Browser Source/Chromium after speechSynthesis has finished.
  const player=document.getElementById("recorded-voice-player");
  if(!player){
    console.error("PAYUU VOICE: audio element missing");
    finish();
    return false;
  }

  try{
    player.pause();
    player.removeAttribute("src");
    player.load();
    player.src=url;
    player.volume=Math.max(0,Math.min(1,Number(item?.voiceVolume??siteSettings.voice?.volume??.9)));
    player.muted=false;
    player.autoplay=false;
    player.onended=finish;
    player.onerror=()=>{
      const mediaError=player.error;
      console.error("PAYUU VOICE: HTML audio error",{
        code:mediaError?.code,
        message:mediaError?.message,
        networkState:player.networkState,
        readyState:player.readyState,
        url
      });
    };
    player.load();

    // Give the TTS engine a moment to release its audio output before
    // starting the recorded stream.
    await new Promise(resolve=>setTimeout(resolve,150));

    const p=player.play();
    if(p&&typeof p.then==="function"){
      await p;
    }
    console.log("PAYUU VOICE: HTML audio playback started",{key});
    return true;
  }catch(htmlError){
    console.warn("PAYUU VOICE: HTML audio playback failed; trying Web Audio",{
      name:htmlError?.name,message:htmlError?.message,key
    });
  }

  // Fallback: decode the same R2 response and play it through AudioContext.
  try{
    const ctx=ensureRecordedVoiceOutput();
    if(!ctx)throw new Error("AudioContext unavailable");
    if(ctx.state==="suspended")await ctx.resume();

    const response=await fetch(url,{cache:"no-store",credentials:"same-origin"});
    if(!response.ok)throw new Error("Voice fetch HTTP "+response.status);
    const buffer=await response.arrayBuffer();
    const audioBuffer=await ctx.decodeAudioData(buffer.slice(0));

    const source=ctx.createBufferSource();
    const gain=ctx.createGain();
    gain.gain.value=Math.max(0,Math.min(1,Number(item?.voiceVolume??siteSettings.voice?.volume??.9)));
    source.buffer=audioBuffer;
    source.connect(gain);
    gain.connect(ctx.destination);
    source.onended=finish;
    source.start(0);

    console.log("PAYUU VOICE: Web Audio fallback started",{key,duration:audioBuffer.duration});
    return true;
  }catch(webAudioError){
    console.error("PAYUU VOICE: BOTH playback methods failed",{
      key,url,
      error:webAudioError?.message||String(webAudioError)
    });
    finish();
    return false;
  }
}
function playAlertSpeech(item,onDone){const msg=cleanSpeechText(item?.msg),done=typeof onDone==='function'?onDone:()=>{};speak(buildIntro(item),()=>{if(msg)speak(`Message: ${msg}`,done);else done()});}
async function showNormalAlert(item,key){
  if(!item||item.eventType==="engagement")return;
  const id=String(key||item.id||"");
  if(id&&displayedSuperChats.has(id))return;
  const ts=Number(item.timestamp||0);
  if(ts&&ts<overlayOpenedAt)return;
  if(id)displayedSuperChats.add(id);

  playAlertChime();
  triggerConfettiBurst();

  await new Promise(resolve=>{
    showNormalAlertCard(item);
    const finish=()=>resolve();
    if(String(item.voiceKey||item.voiceUrl||"").trim()){
      playAlertSpeech(item,()=>playRecordedVoice(item,finish));
    }else{
      playAlertSpeech(item,finish);
    }
  });

  // Keep the queue item so every active overlay instance can receive the same new alert.
  // Old items are ignored/cleaned by startSuperChatListener().
}
function showNormalAlertCard(item){const card=document.getElementById("alert-card");if(!card)return;document.getElementById("alert-name").textContent=item.name||"A Supporter";document.getElementById("alert-amount").textContent=`₹${Number(item.amount||0).toLocaleString("en-IN")}`;document.getElementById("alert-message").textContent=item.msg||"";card.classList.add("active");
  const duration=Math.max(3,Math.min(30,Number(siteSettings.overlay?.duration||8)));
  setTimeout(()=>card.classList.remove("active"),duration*1000);
}
function startSuperChatListener(){
  if(superChatListenerStarted||!window.firebaseDB?.listenOverlay)return;
  superChatListenerStarted=true;
  window.firebaseDB.listenOverlay(async(item,key)=>{
    if(!item||!key||item.eventType==="engagement")return;
    const ts=Number(item.timestamp||0);
    const age=ts?Date.now()-ts:0;
    if(ts && age>10*60*1000){
      try{await window.firebaseDB.removeOverlayAlert(key)}catch(_){}
      return;
    }
    try{
      await showNormalAlert(item,key);
    }catch(e){
      console.error("Overlay alert handling failed:",e);
    }
  });
}
function waitForOverlayFirebase(){
  if(window.firebaseDB&&typeof window.firebaseDB.listenOverlay==="function"){
    startSuperChatListener();
    return;
  }
  setTimeout(waitForOverlayFirebase,300);
}
waitForOverlayFirebase();
</script></body></html>
