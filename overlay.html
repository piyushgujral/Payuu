        /* ============================================================

           ============================================================ */

        function playAlertChime() {

            try {

                    siteSettings.overlay &&
                    siteSettings.overlay.sound === false

                    return;
                }

                    window.AudioContext ||
                    window.webkitAudioContext;

                const ctx = new AudioContextClass();

                const volume =
                    Number(siteSettings.overlay?.volume ?? 0.8);

                const osc1 = ctx.createOscillator();
                const gain1 = ctx.createGain();

                osc1.type = "sine";

                osc1.frequency.setValueAtTime(
                    880,
                    ctx.currentTime
                );

                gain1.gain.setValueAtTime(
                    0.35 * volume,
                    ctx.currentTime
                );

                gain1.gain.exponentialRampToValueAtTime(
                    0.0001,
                    ctx.currentTime + 0.8
                );

                osc1.connect(gain1);
                gain1.connect(ctx.destination);

                osc1.start();
                osc1.stop(ctx.currentTime + 0.8);

                const osc2 = ctx.createOscillator();
                const gain2 = ctx.createGain();

                osc2.type = "sine";

                osc2.frequency.setValueAtTime(
                    1046.50,
                    ctx.currentTime + 0.15
                );

                gain2.gain.setValueAtTime(
                    0.4 * volume,
                    ctx.currentTime + 0.15
                );

                gain2.gain.exponentialRampToValueAtTime(
                    0.0001,
                    ctx.currentTime + 1.2
                );

                osc2.connect(gain2);
                gain2.connect(ctx.destination);

                osc2.start(ctx.currentTime + 0.15);
                osc2.stop(ctx.currentTime + 1.25);

            } catch (error) {
                console.warn("Chime error:", error);
            }
        }

        /* ============================================================

            }

        /* ============================================================
           NORMAL TTS ENGINE
           ============================================================ */

        function speakTextWithTTS(text, onComplete) {

            const done =
                typeof onComplete === "function"
                    ? onComplete
                    : () => {};

            if (!text) {
                done();
                return;
            }

            if (!("speechSynthesis" in window)) {
                done();
                return;
            }

            if (
                siteSettings.voice &&
                siteSettings.voice.enabled === false
            ) {
                done();
                return;
            }

            let finished = false;

            const finish = () => {

                if (finished) return;

                finished = true;

                done();
            };

            try {

                window.speechSynthesis.cancel();

                const utterance =
                    new SpeechSynthesisUtterance(text);

                const lang =
                    siteSettings.voice?.language ||
                    "en-IN";

                utterance.lang = lang;

                utterance.volume =
                    siteSettings.voice?.volume !== undefined
                        ? Math.max(
                            0,
                            Math.min(
                                1,
                                Number(siteSettings.voice.volume)
                            )
                        )
                        : 0.9;

                utterance.rate =
                    siteSettings.voice?.rate !== undefined
                        ? Math.max(
                            0.5,
                            Math.min(
                                2,
                                Number(siteSettings.voice.rate)
                            )
                        )
                        : 1.0;

                utterance.pitch =
                    siteSettings.voice?.gender === "male"
                        ? Math.max(
                            0.1,
                            Math.min(
                                2,
                                Number(
                                    siteSettings.voice?.pitch || 0.8
                                )
                            )
                        )
                        : Math.max(
                            0.1,
                            Math.min(
                                2,
                                Number(
                                    siteSettings.voice?.pitch || 1.2
                                )
                            )
                        );

                const voices =
                    window.speechSynthesis.getVoices();

                const languageBase =
                    lang
                        .split("-")[0]
                        .toLowerCase();

                const matchedVoice =
                    voices.find(
                        voice =>
                            voice.lang &&
                            voice.lang.toLowerCase() ===
                            lang.toLowerCase()
                    ) ||
                    voices.find(
                        voice =>
                            voice.lang &&
                            voice.lang
                                .toLowerCase()
                                .startsWith(languageBase)
                    );

                if (matchedVoice) {
                    utterance.voice = matchedVoice;
                }

                utterance.onend = finish;
                utterance.onerror = (error) => {
                    console.warn(
                        "Speech synthesis error:",
                        error
                    );
                    finish();
                };

                setTimeout(() => {

                    try {

                        window.speechSynthesis.speak(
                            utterance
                        );

                    } catch (error) {

                        console.error(
                            "Unable to start TTS:",
                            error
                        );

                        finish();
                    }

                }, 500);

                /*
                   Safety timeout.

                   It is intentionally based on text length
                   and does NOT check speechSynthesis.speaking
                   immediately after speak(), because Chrome
                   can briefly report false before speech begins.
                */

                const estimatedDuration =
                    Math.max(
                        7000,
                        Math.min(
                            45000,
                            text.length * 130
                        )
                    );

                setTimeout(() => {

                    if (!finished) {

                        try {
                            window.speechSynthesis.cancel();
                        } catch (_) {}

                        finish();
                    }

                }, estimatedDuration);

            } catch (error) {

                console.error(
                    "TTS engine error:",
                    error
                );

                finish();
            }
        }

        /* ============================================================
           ORIGINAL SUPPORTER VOICE
           ============================================================ */

        function playOriginalSupporterVoice(
            item,
            onComplete
        ) {
            const done =
                typeof onComplete === "function"
                    ? onComplete
                    : () => {};

            const voiceUrl =
                item?.voiceUrl
                    ? String(item.voiceUrl)
                    : "";

            if (
                !voiceUrl ||
                item?.voiceEnabled !== true ||
                item?.voiceStatus === "rejected"
            ) {
                done();
                return;
            }

            let audio =
                document.getElementById(
                    "supporter-voice-player"
                );

            if (!audio) {
                audio = document.createElement("audio");
                audio.id = "supporter-voice-player";
                audio.preload = "auto";
                audio.setAttribute("playsinline", "");
                audio.style.display = "none";
                document.body.appendChild(audio);
            }

            let finished = false;
            let attempts = 0;

            const finish = () => {
                if (finished) return;
                finished = true;

                audio.onended = null;
                audio.onerror = null;
                audio.oncanplay = null;
                audio.onloadeddata = null;

                done();
            };

            const volume =
                siteSettings.overlay?.volume !== undefined
                    ? Number(siteSettings.overlay.volume)
                    : 0.9;

            audio.volume = Math.max(
                0,
                Math.min(1, Number.isFinite(volume) ? volume : 0.9)
            );

            audio.pause();
            try {
                audio.currentTime = 0;
            } catch (_) {}

            audio.src = voiceUrl;

            audio.onended = finish;

            audio.onerror = (error) => {
                console.warn(
                    "Original supporter voice playback error:",
                    error,
                    voiceUrl
                );

                if (attempts < 3) {
                    attempts++;
                    setTimeout(startPlayback, 800);
                } else {
                    finish();
                }
            };

            const startPlayback = () => {
                if (finished) return;

                attempts++;

                try {
                    audio.load();
                } catch (_) {}

                const playPromise = audio.play();

                if (
                    playPromise &&
                    typeof playPromise.catch === "function"
                ) {
                    playPromise.catch(error => {
                        console.warn(
                            `Original supporter voice play attempt ${attempts} failed:`,
                            error
                        );

                        if (attempts < 4) {
                            setTimeout(startPlayback, 900);
                        } else {
                            finish();
                        }
                    });
                }
            };

            const beginWhenReady = () => {
                if (finished) return;

                setTimeout(() => {
                    if (!finished) startPlayback();
                }, 150);
            };

            audio.oncanplay = beginWhenReady;
            audio.onloadeddata = beginWhenReady;

               R2 signed URLs can take longer to initialize inside an
               OBS/LiveNow browser source. Start immediately and retry
               rather than falling back to TTS before the recording loads.
            */
            setTimeout(() => {
                if (!finished) startPlayback();
            }, 700);

            setTimeout(() => {
                if (!finished) {
                    console.warn(
                        "Original supporter voice timed out:",
                        voiceUrl
                    );
                    finish();
                }
            }, 10000);
        }

    const done =
        typeof onComplete === "function"

            : () => {};

    /*

    */

    const amount =

    const message =
        item?.msg
            ? String(item.msg).trim()
            : "";

    const introText =
        `New Support! ${name} supported ${amount} rupees.`;

    const speechText =
        message
            ? `${introText} Message: ${message}`
            : introText;

    /*
       STEP 2 — AFTER TTS, PLAY ORIGINAL VOICE
    */

    const playOriginalVoice = () => {

        const hasVoice =
            item?.voiceUrl &&
            item.voiceEnabled === true &&
            item.voiceStatus !== "rejected";

        if (!hasVoice) {
            done();
            return;
        }

        playOriginalSupporterVoice(
            item,
            done
        );
    };

    /*
       PLAY INTRO TTS FIRST
    */

    speakTextWithTTS(
        speechText,
        playOriginalVoice
    );
}
        /* ============================================================

        function populateAlertCard(item) {

            const nameEl =
                document.getElementById(
                    "alert-name"
                );

            const amountEl =
                document.getElementById(
                    "alert-amount"
                );

            const msgEl =

                    "none";

                msgEl.textContent =

           ============================================================ */

        function finishCurrentAlert() {

            if (!currentAlert) {
                isDisplayingAlert = false;
                processNextAlert();
                return;

            const item =

            currentAlert = null;

            const card =
                document.getElementById(
                    "alert-card"

            if (card) {

                card.classList.remove(
                    "active"
                );

                card.classList.add(
                    "exiting"
                );
            }

            setTimeout(() => {

                if (
                    window.firebaseDB &&
                    typeof window.firebaseDB.removeOverlayAlert ===
                        "function" &&
                    item._key
                ) {

                    try {

                        window.firebaseDB.removeOverlayAlert(
                            item._key
                        );

                    } catch (error) {

                        console.warn(
                            "Unable to remove overlay item:",
                            error
                        );
                    }

                if (card) {

                    card.classList.remove(
                        "exiting"
                    );

                isDisplayingAlert =
                    false;

                processNextAlert();

                Number(

                Math.max(

                    minimumTimeFinished
                ) {

                    closed = true;

                    finishCurrentAlert();
                }
            };

            /*
               Start original voice or TTS.
            */

            speakAlertVoice(
                item,
                () => {

                    voiceFinished =
                        true;

                    attemptClose();
                }
            );

            /*
               Minimum card display time.
            */

            setTimeout(() => {

                minimumTimeFinished =
                    true;

                attemptClose();

            }, minimumDisplayMs);

            /*
               Absolute safety limit.
               
               Prevents a broken audio URL or browser
               speech engine from blocking the queue forever.
            */

            const safetyMs =
                Math.max(
                    minimumDisplayMs + 15000,
                    30000
                );

            setTimeout(() => {

                if (closed) return;

                closed = true;

                try {

                    if (
                        "speechSynthesis" in window
                    ) {
                        window.speechSynthesis.cancel();
                    }

                } catch (_) {}

                finishCurrentAlert();

            }, safetyMs);
        }

        /* ============================================================
           FIREBASE OVERLAY LISTENER
           ============================================================ */

        document.addEventListener(
            "DOMContentLoaded",
            () => {

                /*
                   Fallback remove function.
                */

                if (
                    window.firebaseDB &&
                    !window.firebaseDB.removeOverlayAlert
                ) {

                    window.firebaseDB.removeOverlayAlert =
                        function(key) {

                            try {

                                if (
                                    window.firebase &&
                                    firebase.database
                                ) {

                                    return firebase
                                        .database()
                                        .ref(
                                            "overlayQueue/" +
                                            key
                                        )
                                        .remove();
                                }

                            } catch (error) {

                                console.error(
                                    "Overlay remove error:",
                                    error
                                );
                            }
                        };
                }

                /*
                   Load browser voices.
                */

                if (
                    window.speechSynthesis &&
                    window.speechSynthesis.onvoiceschanged !==
                        undefined
                ) {

                    window.speechSynthesis.onvoiceschanged =
                        () => {

                            try {
                                window.speechSynthesis.getVoices();
                            } catch (_) {}

                        };
                }

                /*
                   Firebase overlay queue.
                */

                if (
                    window.firebaseDB &&
                    typeof window.firebaseDB.listenOverlay ===
                        "function"
                ) {

                    window.firebaseDB.listenOverlay(
                        async (data, key) => {

                            if (!data || !key) {
                                return;
                            }

                            /*
                               Atomically claim the Firebase queue item.
                               Only the first active overlay instance that
                               successfully claims it is allowed to play it.
                            */
                            if (
                                typeof window.firebaseDB.claimOverlayAlert ===
                                    "function"
                            ) {
                                try {

                                    const claimed =
                                        await window.firebaseDB.claimOverlayAlert(
                                            key,
                                            overlayClientId
                                        );

                                    if (!claimed) {
                                        return;
                                    }

                                } catch (error) {

                                    console.error(
                                        "Overlay queue claim failed:",
                                        error
                                    );

                                    return;
                                }
                            }

                            /*
                               Prevent accidental duplicate insertion of
                               the same Firebase key.
                            */
                            const alreadyQueued =
                                overlayQueue.some(
                                    item =>
                                        item._key === key
                                );

                            if (
                                currentAlert &&
                                currentAlert._key === key
                            ) {
                                return;
                            }

                            if (alreadyQueued) {
                                return;
                            }

                            overlayQueue.push({
                                ...data,
                                _key: key,
                                claimedBy: overlayClientId
                            });

                            processNextAlert();
                        }
                    );
                }

            }
        );

        /* ============================================================
           DEBUG HELPERS
           ============================================================ */

        window.payuuOverlayTest = function() {

            const testItem = {

                name: "Test Supporter",

                amount: 100,

                msg: "This is a Payuu Live test alert.",

                messageSource: "text",

                voiceEnabled: false,

                voiceStatus: "none"
            };

            overlayQueue.push({
                ...testItem,
                _key:
                    "local-test-" +
                    Date.now()
            });

            processNextAlert();
        };

        window.payuuOverlayTestVoice =
            function() {

                const testItem = {

                    name: "Voice Test",

                    amount: 500,

                    msg: "This is a voice alert test.",

                    messageSource: "voice",

                    voiceEnabled: false,

                    voiceStatus: "none"
                };

                overlayQueue.push({
                    ...testItem,
                    _key:
                        "local-voice-test-" +
                        Date.now()
                });

                processNextAlert();
            };

        console.log(
            "Payuu Live unified overlay engine loaded."
        );

    </script>

</body>
