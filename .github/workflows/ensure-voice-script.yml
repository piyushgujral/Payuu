name: Enable Payuu Voice Recorder

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enable-voice-recorder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure voice recorder is loaded
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          tag = '    <script src="js/voice-recorder.js"></script>\n'

          if 'js/voice-recorder.js' not in text:
              marker = '    <script src="script.js"></script>'
              if marker not in text:
                  raise SystemExit('Could not find script.js in index.html')
              text = text.replace(marker, tag + marker, 1)
              path.write_text(text, encoding='utf-8')
              print('Voice recorder script added to index.html')
          else:
              print('Voice recorder script already loaded')
          PY

      - name: Commit index update
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'No index.html change required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load Payuu voice recorder'
          git push
