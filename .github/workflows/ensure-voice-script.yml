name: Validate Payuu frontend wiring

on:
  push:
    branches: [main, audit-fix-20260918]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required scripts
        shell: bash
        run: |
          set -euo pipefail

          grep -q 'js/voice-recorder.js' index.html
          grep -q 'js/engagement-admin.js' index.html
          grep -q 'js/engagement-overlay.js' overlay.html
          grep -q 'firebase.js' overlay.html
          test -f api/upload-voice.js
          test -f api/play-voice.js

          node --check api/upload-voice.js
          node --check api/play-voice.js
          node --check js/voice-recorder.js
          node --check js/engagement-admin.js
          node --check js/engagement-overlay.js
          node --check js/voice.js
          node --check js/overlay.js

          echo "Payuu script wiring and Node-compatible files validated."
