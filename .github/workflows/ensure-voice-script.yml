name: Enable Payuu Voice Recorder

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enable-voice-recorder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure Payuu scripts are loaded
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')

          scripts = [
              '    <script src="js/voice-recorder.js"></script>\n',
              '    <script src="js/engagement-admin.js"></script>\n'
          ]
          marker = '    <script src="script.js"></script>'
          if marker not in text:
              raise SystemExit('Could not find script.js in index.html')

          for tag in scripts:
              if tag.strip() not in text:
                  text = text.replace(marker, tag + marker, 1)

          index.write_text(text, encoding='utf-8')

          overlay = Path('overlay.html')
          overlay_text = overlay.read_text(encoding='utf-8')
          overlay_marker = '    <script src="firebase.js"></script>'
          engagement_tag = '    <script src="js/engagement-overlay.js"></script>\n'
          if overlay_marker not in overlay_text:
              raise SystemExit('Could not find firebase.js in overlay.html')
          if engagement_tag.strip() not in overlay_text:
              overlay_text = overlay_text.replace(overlay_marker, overlay_marker + '\n' + engagement_tag, 1)
              overlay.write_text(overlay_text, encoding='utf-8')
          PY

      - name: Commit index and overlay updates
        shell: bash
        run: |
          if git diff --quiet -- index.html overlay.html; then
            echo 'No script-loading changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html overlay.html
          git commit -m 'Load Payuu engagement overlay controls'
          git push
